[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "git-worktree-env"
version = "0.2.0"
description = "Transition package for the renamed worktree-env project"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Shitong Chen" },
]
classifiers = [
  "Development Status :: 7 - Inactive",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "worktree-env>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/archcst/worktree-env"
Repository = "https://github.com/archcst/worktree-env"
Issues = "https://github.com/archcst/worktree-env/issues"

[project.scripts]
wte = "git_worktree_env_compat:main"
git-worktree-env = "git_worktree_env_compat:main"

[tool.hatch.build.targets.wheel]
packages = ["src/git_worktree_env_compat"]
