# One profile describes one project and its dedicated main worktree.
name: example-fullstack

match:
  main-worktree: $HOME/code/example-app

# Claims are allocated as one contiguous block in declaration order.
port-claims:
  - id: frontend
  - id: backend

# Sources stay outside Git. Targets are symlinks inside every linked worktree.
link-files:
  - source: $HOME/.config/example-app/frontend.env
    target: apps/frontend/.env
  - source: $HOME/.config/example-app/backend.env
    target: apps/backend/.env

write-files:
  - target: apps/frontend/.env.development
    body: |
      VITE_PORT=${frontend}
      VITE_API_URL=http://127.0.0.1:${backend}

  - target: apps/backend/.env.development
    body: |
      PORT=${backend}
      CORS_ORIGIN=http://127.0.0.1:${frontend}

# Initializers run in the background from post-checkout, the Monitor, or wte sync.
# Each command is trusted local configuration and is executed directly.
setup-commands:
  - command: [npm]
    args: [install]
    cwd: apps/frontend
    skip-if: node_modules
  - command: [uv]
    args: [sync]
    cwd: apps/backend
    skip-if: .venv
